<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d">
<title id="t">One upload through the API, topic, worker and bucket</title>
<desc id="d">The client posts a name to the API, which validates it, publishes to the uploads topic and answers 202. Pub/Sub pushes the message to the worker with an OIDC token for pubsub-invoker, and the worker creates the result in the bucket if absent and answers 204, which acknowledges the message. In the amber rows the write is denied with a 403, the worker answers 500 and Pub/Sub retries, and after five attempts the message goes to the uploads-dead topic.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="739" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="738" rx="16"/>
<text class="title" x="48" y="68">One upload, and one that fails</text>
<text class="caption" x="48" y="100">A name goes API, topic, worker, bucket. Amber: a denied write is retried five times, then dead-lettered.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Client</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">API</text>
<rect class="svc" x="706" y="128" width="128" height="48" rx="10"/>
<text class="lane" x="770" y="148" text-anchor="middle">uploads</text>
<text class="lane" x="770" y="168" text-anchor="middle">topic</text>
<rect class="svc" x="880" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">Worker</text>
<rect class="svc" x="1024" y="128" width="128" height="48" rx="10"/>
<text class="lane" x="1088" y="148" text-anchor="middle">Results</text>
<text class="lane" x="1088" y="168" text-anchor="middle">bucket</text>
<path class="hair" d="M460 176V232M610 176V360M770 176V616M940 176V552M1088 176V552"/>
<path class="hair" d="M66 216V600"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">The client posts a name</text>
<text class="sub" x="96" y="232">name: report-1</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="476" y="206">POST /upload</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The API validates the name</text>
<text class="sub" x="96" y="296">letters, digits, . _ - only</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">400 if bad</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">The API publishes</text>
<text class="sub" x="96" y="360">answers 202 with the message id</text>
<path class="sync" d="M610 344H770"/>
<text class="label t-accent" x="626" y="334">publish</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Pub/Sub pushes with a token</text>
<text class="sub" x="96" y="424">OIDC for pubsub-invoker</text>
<path class="async" d="M770 408H940"/>
<text class="label t-accent" x="786" y="398">push + OIDC</text>
<circle class="dot-g" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">The worker creates the result</text>
<text class="sub" x="96" y="488">create if absent, then 204</text>
<path class="sync" d="M940 472H1088"/>
<text class="label t-accent" x="956" y="462">create</text>
<rect class="win" x="555" y="452" width="185" height="40" rx="10"/>
<text class="label b t-good" x="571" y="477">204: acknowledged</text>
<path class="ok" d="M940 472H740"/>
<circle class="dot-w" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">Failure: the write is denied</text>
<text class="sub" x="96" y="552">403 from storage, worker 500</text>
<path class="fail" d="M1088 536H940"/>
<text class="label t-warn" x="1000" y="526">403</text>
<path class="fail" d="M940 536H770"/>
<text class="label t-warn" x="786" y="526">500, retry</text>
<circle class="dot-w" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="596">After 5 attempts: dead letter</text>
<text class="sub" x="96" y="616">uploads-dead keeps it 7 days</text>
<rect class="slot" x="764" y="582" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="605">uploads-dead</text>
<path class="sync" d="M48 696H112"/><text class="legend" x="124" y="701">sync call</text>
<path class="async" d="M264 696H328"/><text class="legend" x="340" y="701">async message</text>
<path class="fail" d="M696 696H760"/><text class="legend" x="772" y="701">failure path</text>
<path class="ok" d="M928 696H992"/><text class="legend" x="1004" y="701">result</text>
</svg>

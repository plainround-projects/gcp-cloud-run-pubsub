<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Upload API and Pub/Sub push worker on Cloud Run</title>
<desc id="d">A client posts to the API, a Cloud Run service running as api-sa, which reads its database password from Secret Manager at start-up and publishes to the uploads topic. The topic pushes to the private Worker service, running as worker-sa, with an OIDC token for the pubsub-invoker account, and the worker creates a result file in the results bucket if it is absent. In amber, after five failed attempts the message goes to the uploads-dead topic and is kept in the uploads-dead-pull subscription for a replay.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="799" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="798" rx="16"/>
<text class="title" x="48" y="68">An upload API and a Pub/Sub push worker</text>
<text class="caption" x="48" y="100">Each service runs as its own account; the push carries an OIDC token. Amber: five failed pushes go to uploads-dead.</text>
<rect class="actor" x="48" y="214" width="152" height="72" rx="36"/>
<text class="name" x="124" y="246" text-anchor="middle">Client</text>
<text class="sub" x="124" y="268" text-anchor="middle">POST /upload</text>
<rect class="boundary" x="296" y="132" width="856" height="600" rx="14"/>
<text class="tag" x="312" y="160">GCP project, one region</text>
<rect class="svc" x="320" y="188" width="216" height="124" rx="12"/>
<text class="name" x="336" y="220">API</text>
<text class="sub" x="336" y="244">Cloud Run, api-sa,</text>
<text class="sub" x="336" y="268">202, or 503 when</text>
<text class="sub" x="336" y="290">the broker fails</text>
<rect class="svc" x="608" y="188" width="216" height="100" rx="12"/>
<text class="name" x="624" y="220">uploads topic</text>
<text class="sub" x="624" y="244">push subscription,</text>
<text class="sub" x="624" y="268">5 attempts, backoff</text>
<rect class="svc" x="936" y="188" width="200" height="150" rx="12"/>
<text class="name" x="952" y="220">Worker</text>
<text class="sub" x="952" y="244">Cloud Run service</text>
<text class="sub" x="952" y="268">worker-sa, private</text>
<text class="sub" x="952" y="290">run.invoker: only</text>
<text class="sub" x="952" y="312">pubsub-invoker</text>
<path class="store" d="M320 420a108 12 0 0 1 216 0v86a108 12 0 0 1 -216 0z"/>
<path class="rim" d="M320 420a108 12 0 0 0 216 0"/>
<text class="name" x="428" y="456" text-anchor="middle">db-password</text>
<text class="sub" x="428" y="480" text-anchor="middle">Secret Manager</text>
<text class="sub" x="428" y="502" text-anchor="middle">read by api-sa</text>
<path class="store" d="M936 440a100 12 0 0 1 200 0v86a100 12 0 0 1 -200 0z"/>
<path class="rim" d="M936 440a100 12 0 0 0 200 0"/>
<text class="name" x="1036" y="476" text-anchor="middle">Results bucket</text>
<text class="sub" x="1036" y="500" text-anchor="middle">results/NAME.txt</text>
<text class="sub" x="1036" y="522" text-anchor="middle">versioned, private</text>
<rect class="svc" x="608" y="440" width="216" height="100" rx="12"/>
<text class="name" x="624" y="472">uploads-dead</text>
<text class="sub" x="624" y="496">dead-letter topic,</text>
<text class="sub" x="624" y="520">kept 7 days</text>
<rect class="svc" x="596" y="600" width="240" height="84" rx="12"/>
<text class="name" x="612" y="632">Pull subscription</text>
<text class="sub" x="612" y="656">uploads-dead-pull</text>
<rect class="note" x="868" y="570" width="268" height="124" rx="10"/>
<text class="label b t-warn" x="884" y="600">break-permission.sh</text>
<text class="sub" x="884" y="626">worker-sa loses its role:</text>
<text class="sub" x="884" y="648">storage 403, worker 500,</text>
<text class="sub" x="884" y="670">5 attempts, dead letter</text>
<path class="sync" d="M200 250H320"/>
<text class="label t-accent" x="206" y="240">/upload</text>
<path class="sync" d="M536 250H608"/>
<text class="label t-accent" x="542" y="240">publish</text>
<path class="async" d="M824 250H936"/>
<text class="label t-accent" x="828" y="240">push + OIDC</text>
<path class="read" d="M428 408V314"/>
<text class="label" x="440" y="370">at start-up</text>
<path class="sync" d="M1036 338V428"/>
<text class="label t-accent" x="1024" y="392" text-anchor="end">create if absent</text>
<path class="fail" d="M716 288V440"/>
<text class="label t-warn" x="728" y="370">after 5 attempts</text>
<path class="async" d="M716 540V600"/>
<path class="fail" d="M824 520H850Q862 520 862 532V620Q862 632 874 632H868"/>
<path class="sync" d="M48 756H112"/><text class="legend" x="124" y="761">sync call</text>
<path class="async" d="M264 756H328"/><text class="legend" x="340" y="761">async message</text>
<path class="read" d="M520 756H584"/><text class="legend" x="596" y="761">read</text>
<path class="fail" d="M696 756H760"/><text class="legend" x="772" y="761">failure path</text>
</svg>

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gcp-cloud-run-pubsub"
version = "0.1.0"
description = "An upload API and a Pub/Sub push worker on Cloud Run, each with its own service account and no keys, defined in Terraform."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = [
    "flask==3.1.3",
    "gunicorn==26.2.0",
    "google-cloud-pubsub==2.43.0",
    "google-cloud-storage==3.17.1",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "S", "D100", "D101", "D103", "D104"]
# Named errors such as PublishFailed read as the event they report; the suffix would only lengthen them.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

# google-auth ships AnonymousCredentials without annotations.
[[tool.mypy.overrides]]
module = ["uploads.infrastructure.gcs_result_store"]
disallow_untyped_calls = false

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the emulators from docker-compose.yml (make emulators)",
    "e2e: runs the lesson's scenario through the real adapters against the emulators",
]

[tool.coverage.run]
source = ["uploads"]
branch = true
omit = ["src/uploads/interfaces/gunicorn_conf.py"]  # settings read by gunicorn, exercised by `make run`

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "uploads"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "uploads.interfaces",
    "uploads.infrastructure",
    "uploads.application",
    "uploads.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application know nothing about Google Cloud, Flask or the network"
type = "forbidden"
source_modules = ["uploads.domain", "uploads.application"]
forbidden_modules = ["google", "flask", "requests"]
